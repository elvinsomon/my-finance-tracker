version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: myfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financemanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Uncomment if you have init-db.sql
      # - ./docs/infrastructure/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financemanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - myfinance-network

  # Seq Logging Server
  seq:
    image: datalust/seq:2024
    container_name: myfinance-seq
    restart: unless-stopped
    user: "0:0"  # Run as root to avoid permission issues on macOS
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:80"      # Seq Web UI
      - "5342:5341"    # Seq ingestion endpoint
    volumes:
      - seq_data:/data
    networks:
      - myfinance-network

  # Backend API (.NET)
  api:
    build:
      context: ./src/FinanceTrackerAPI
      dockerfile: Dockerfile
    container_name: myfinance-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=financemanager;Username=postgres;Password=postgres
      - Jwt__Secret=MyFinanceTrackerSuperSecretKey32CharactersMinimum!
      - Jwt__Issuer=FinanceManagerAPI
      - Jwt__Audience=FinanceManagerClient
      - Jwt__ExpirationHours=24
      - Serilog__WriteTo__0__Name=Console
      - Serilog__WriteTo__1__Name=Seq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    ports:
      - "5001:80"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    networks:
      - myfinance-network

  # Frontend (React)
  frontend:
    build:
      context: ./src/finance-tracker-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: myfinance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - myfinance-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: myfinance_postgres_data
  seq_data:
    driver: local
    name: myfinance_seq_data

# Shared network for inter-service communication
networks:
  myfinance-network:
    driver: bridge
    name: myfinance-network
